name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-13, ubuntu-22.04]
        python: ["3.12"]
        include:
          - os: ubuntu-22.04
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false  # no go.sum in this repo

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check vizcacha tests

      - name: Architecture contracts
        run: lint-imports

      - name: Translations compile
        run: pybabel compile -d vizcacha/i18n/locale -D vizcacha --statistics

      - name: Tests
        run: python -m pytest -q
