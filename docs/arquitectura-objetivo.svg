<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .layer { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
      .rule { font-size: 11px; fill: #64748b; font-style: italic; }
      .name { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .desc { font-size: 11px; fill: #334155; }
      .tag { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .lbl { font-size: 11px; fill: #334155; }
      .t0 { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
      .tA { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .tB { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .tC { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .tD { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .tE { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.5; }
      .tF { fill: #fdf4ff; stroke: #c026d3; stroke-width: 1.5; }
      .tG { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; }
      .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1240" height="940" fill="#ffffff"/>
  <text x="30" y="40" class="title">VizcachaIDE — Arquitectura objetivo y tracks paralelos</text>
  <text x="30" y="62" class="sub">Clean Architecture · PyQt5 · bilingüe EN/ES · Windows / macOS / Linux · cada color = un agente en su propio worktree</text>

  <!-- Leyenda de tracks -->
  <g transform="translate(30,80)">
    <rect x="0" y="0" width="14" height="12" class="t0"/><text x="19" y="10" class="lbl">Fase 0 · cimientos</text>
    <rect x="135" y="0" width="14" height="12" class="tA"/><text x="154" y="10" class="lbl">A · Depurador</text>
    <rect x="250" y="0" width="14" height="12" class="tB"/><text x="269" y="10" class="lbl">B · Assistant EN/ES</text>
    <rect x="395" y="0" width="14" height="12" class="tC"/><text x="414" y="10" class="lbl">C · gopls</text>
    <rect x="490" y="0" width="14" height="12" class="tD"/><text x="509" y="10" class="lbl">D · Editor</text>
    <rect x="585" y="0" width="14" height="12" class="tE"/><text x="604" y="10" class="lbl">E · Proyecto/toolchain</text>
    <rect x="745" y="0" width="14" height="12" class="tF"/><text x="764" y="10" class="lbl">F · Empaquetado</text>
    <rect x="870" y="0" width="14" height="12" class="tG"/><text x="889" y="10" class="lbl">G · Traducción (fase 2)</text>
  </g>

  <!-- ===== UI ===== -->
  <rect x="20" y="110" width="1010" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="132" class="layer">UI · vizcacha/ui/</text>
  <text x="200" y="132" class="rule">único lugar con QtWidgets · cada feature hace register(workbench)</text>

  <rect x="40" y="145" width="250" height="60" rx="8" class="t0"/>
  <text x="54" y="167" class="name">app.py · workbench.py</text>
  <text x="54" y="185" class="desc">composition root · menús, paneles,</text>
  <text x="54" y="199" class="desc">bus de eventos (navigate_to, …)</text>

  <rect x="310" y="145" width="220" height="60" rx="8" class="t0"/>
  <text x="324" y="167" class="name">main_window.py</text>
  <text x="324" y="185" class="desc">sólo layout (splitters)</text>
  <text x="324" y="199" class="desc">sin lógica de negocio</text>

  <rect x="550" y="145" width="220" height="60" rx="8" class="tD"/>
  <text x="564" y="167" class="name">ui/editor/</text>
  <text x="564" y="185" class="desc">CodeEditor, temas, buscar,</text>
  <text x="564" y="199" class="desc">llaves, gofmt al guardar</text>

  <rect x="790" y="145" width="220" height="60" rx="8" class="tG"/>
  <text x="804" y="167" class="name">first_run / settings</text>
  <text x="804" y="185" class="desc">asistente 1er arranque,</text>
  <text x="804" y="199" class="desc">selector de idioma EN/ES</text>

  <text x="40" y="232" class="lbl" font-weight="700">features/</text>
  <rect x="40" y="240" width="150" height="55" rx="8" class="tE"/>
  <text x="52" y="262" class="name">run/ · project/</text>
  <text x="52" y="280" class="desc">Run, Build, Files, go mod</text>

  <rect x="205" y="240" width="150" height="55" rx="8" class="tA"/>
  <text x="217" y="262" class="name">debugger/</text>
  <text x="217" y="280" class="desc">variables, pila, goroutines</text>

  <rect x="370" y="240" width="150" height="55" rx="8" class="tB"/>
  <text x="382" y="262" class="name">assistant/</text>
  <text x="382" y="280" class="desc">explicación EN/ES</text>

  <rect x="535" y="240" width="150" height="55" rx="8" class="tC"/>
  <text x="547" y="262" class="name">language/</text>
  <text x="547" y="280" class="desc">completado, hover, outline</text>

  <rect x="700" y="240" width="150" height="55" rx="8" class="tD"/>
  <text x="712" y="262" class="name">editor/</text>
  <text x="712" y="280" class="desc">acciones de edición</text>

  <rect x="865" y="240" width="145" height="55" rx="8" class="t0"/>
  <text x="877" y="262" class="name">console · help</text>
  <text x="877" y="280" class="desc">reutiliza ConsoleWidget</text>

  <!-- ===== Application ===== -->
  <rect x="20" y="335" width="1010" height="115" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="357" class="layer">APLICACIÓN · vizcacha/application/</text>
  <text x="330" y="357" class="rule">casos de uso + puertos (typing.Protocol) · sólo importa domain</text>

  <rect x="40" y="370" width="240" height="65" rx="8" class="t0"/>
  <text x="54" y="392" class="name">ports.py  (congelado)</text>
  <text x="54" y="410" class="desc">DebuggerPort · LanguageServerPort</text>
  <text x="54" y="424" class="desc">GoToolchainPort · ErrorExplainerPort</text>

  <rect x="295" y="370" width="170" height="65" rx="8" class="tE"/>
  <text x="309" y="392" class="name">run_program.py</text>
  <text x="309" y="410" class="desc">RunConfiguration →</text>
  <text x="309" y="424" class="desc">go run / build</text>

  <rect x="480" y="370" width="170" height="65" rx="8" class="tA"/>
  <text x="494" y="392" class="name">debug_session.py</text>
  <text x="494" y="410" class="desc">estado de sesión,</text>
  <text x="494" y="424" class="desc">breakpoints</text>

  <rect x="665" y="370" width="170" height="65" rx="8" class="tB"/>
  <text x="679" y="392" class="name">explain_error.py</text>
  <text x="679" y="410" class="desc">Diagnostic →</text>
  <text x="679" y="424" class="desc">ErrorExplanation</text>

  <rect x="850" y="370" width="160" height="65" rx="8" class="tD"/>
  <text x="864" y="392" class="name">format_on_save.py</text>
  <text x="864" y="410" class="desc">gofmt conservando</text>
  <text x="864" y="424" class="desc">el cursor</text>

  <!-- ===== Domain ===== -->
  <rect x="20" y="475" width="1010" height="95" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="36" y="497" class="layer">DOMINIO · vizcacha/domain/</text>
  <text x="250" y="497" class="rule">Python puro: sin Qt, sin subprocess · dataclasses inmutables · fase 0</text>
  <g font-size="12">
    <rect x="40" y="510" width="180" height="44" rx="8" class="t0"/>
    <text x="54" y="530" class="name">debugging.py</text><text x="54" y="546" class="desc">Breakpoint, StackFrame, Variable</text>
    <rect x="235" y="510" width="180" height="44" rx="8" class="t0"/>
    <text x="249" y="530" class="name">diagnostics.py</text><text x="249" y="546" class="desc">Diagnostic, SourceLocation</text>
    <rect x="430" y="510" width="200" height="44" rx="8" class="t0"/>
    <text x="444" y="530" class="name">explanations.py</text><text x="444" y="546" class="desc">ErrorExplanation (id estable)</text>
    <rect x="645" y="510" width="175" height="44" rx="8" class="t0"/>
    <text x="659" y="530" class="name">completion.py</text><text x="659" y="546" class="desc">CompletionItem, Signature</text>
    <rect x="835" y="510" width="175" height="44" rx="8" class="t0"/>
    <text x="849" y="530" class="name">project.py</text><text x="849" y="546" class="desc">GoModule, RunConfiguration</text>
  </g>

  <!-- ===== Infrastructure ===== -->
  <rect x="20" y="595" width="1010" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="617" class="layer">INFRAESTRUCTURA · vizcacha/infrastructure/</text>
  <text x="390" y="617" class="rule">implementa los puertos · Qt Core (QProcess, QTcpSocket) · sin widgets</text>

  <rect x="40" y="630" width="180" height="75" rx="8" class="tE"/>
  <text x="54" y="652" class="name">go_toolchain/</text>
  <text x="54" y="670" class="desc">GoEnvironment único,</text>
  <text x="54" y="684" class="desc">runner async, gofmt, vet</text>

  <rect x="235" y="630" width="180" height="75" rx="8" class="tA"/>
  <text x="249" y="652" class="name">delve_dap/</text>
  <text x="249" y="670" class="desc">cliente DAP sobre</text>
  <text x="249" y="684" class="desc">QTcpSocket</text>

  <rect x="430" y="630" width="180" height="75" rx="8" class="tC"/>
  <text x="444" y="652" class="name">gopls_lsp/</text>
  <text x="444" y="670" class="desc">JSON-RPC stdio +</text>
  <text x="444" y="684" class="desc">tipos lsprotocol</text>

  <rect x="625" y="630" width="200" height="75" rx="8" class="tB"/>
  <text x="639" y="652" class="name">error_catalog/</text>
  <text x="639" y="670" class="desc">parser go/panic + ~25</text>
  <text x="639" y="684" class="desc">regex → id (E-UNUSED-VAR…)</text>

  <rect x="840" y="630" width="170" height="75" rx="8" class="t0"/>
  <text x="854" y="652" class="name">settings/</text>
  <text x="854" y="670" class="desc">QSettingsRepository</text>
  <text x="854" y="684" class="desc">(claves actuales)</text>

  <!-- ===== External ===== -->
  <text x="36" y="752" class="layer">EXTERNAS</text>
  <rect x="40" y="762" width="180" height="40" rx="8" class="ext"/>
  <text x="54" y="787" class="desc">go run · build · gofmt · vet</text>
  <rect x="235" y="762" width="180" height="40" rx="8" class="ext"/>
  <text x="249" y="787" class="desc">dlv dap</text>
  <rect x="430" y="762" width="180" height="40" rx="8" class="ext"/>
  <text x="444" y="787" class="desc">gopls serve</text>
  <rect x="625" y="762" width="200" height="40" rx="8" class="ext"/>
  <text x="639" y="787" class="desc">salida en inglés de Go</text>
  <rect x="840" y="762" width="170" height="40" rx="8" class="ext"/>
  <text x="854" y="787" class="desc">Registro / .ini / plist</text>
  <line x1="130" y1="705" x2="130" y2="759" class="edge" marker-end="url(#arr)"/>
  <line x1="325" y1="705" x2="325" y2="759" class="edge" marker-end="url(#arr)"/>
  <line x1="520" y1="705" x2="520" y2="759" class="edge" marker-end="url(#arr)"/>
  <line x1="725" y1="759" x2="725" y2="708" class="edge" marker-end="url(#arr)"/>
  <line x1="925" y1="705" x2="925" y2="759" class="edge" marker-end="url(#arr)"/>

  <!-- ===== Packaging ===== -->
  <rect x="20" y="825" width="1200" height="95" rx="10" class="tF"/>
  <text x="36" y="848" class="layer">F · EMPAQUETADO · packaging/ + .github/workflows/release.yml</text>
  <text x="36" y="872" class="desc">PyInstaller → Windows: Inno Setup (.exe EN/ES) + zip portable · macOS: .dmg x86_64 / arm64 · Linux: AppImage</text>
  <text x="36" y="892" class="desc">Variantes «full» (Go + dlv + gopls incluidos, versiones fijadas con sha256) y «lite» (usa el Go del sistema) · CI matriz 3 SO · aviso de licencia GPL (PyQt5)</text>

  <!-- ===== i18n transversal ===== -->
  <rect x="1050" y="110" width="170" height="700" rx="10" class="tG"/>
  <text x="1064" y="134" class="layer">i18n</text>
  <text x="1064" y="152" class="desc">vizcacha/i18n/ · transversal</text>
  <text x="1064" y="185" class="name">translator.py</text>
  <text x="1064" y="203" class="desc">_() · ngettext()</text>
  <text x="1064" y="219" class="desc">detect_language():</text>
  <text x="1064" y="235" class="desc">es* → es, resto → en</text>
  <text x="1064" y="270" class="name">locale/</text>
  <text x="1064" y="288" class="desc">en/vizcacha.po</text>
  <text x="1064" y="304" class="desc">es/vizcacha.po</text>
  <text x="1064" y="320" class="desc">(gettext + Babel)</text>
  <text x="1064" y="360" class="name">Reglas</text>
  <text x="1064" y="378" class="desc">• texto fuente en inglés</text>
  <text x="1064" y="394" class="desc">• cada track sólo usa _()</text>
  <text x="1064" y="410" class="desc">• .po: sólo track G</text>
  <text x="1064" y="426" class="desc">• error original de Go</text>
  <text x="1064" y="442" class="desc">  siempre visible</text>
  <text x="1064" y="482" class="name">Usado por</text>
  <text x="1064" y="500" class="desc">UI (menús, diálogos)</text>
  <text x="1064" y="516" class="desc">domain/explanations</text>
  <text x="1064" y="532" class="desc">error_catalog</text>
  <text x="1064" y="548" class="desc">instalador (Inno)</text>
  <text x="1064" y="588" class="name">Docs</text>
  <text x="1064" y="606" class="desc">README.md / .es.md</text>
  <text x="1064" y="622" class="desc">docs/help/{en,es}</text>
  <text x="1064" y="638" class="desc">notas de versión EN/ES</text>
  <text x="1064" y="678" class="name">Fuera de alcance</text>
  <text x="1064" y="696" class="desc">MicroPython · TinyGo</text>
  <text x="1064" y="712" class="desc">microcontroladores</text>

  <!-- dependencias entre capas -->
  <line x1="300" y1="310" x2="300" y2="332" class="edge" marker-end="url(#arr)"/>
  <text x="308" y="327" class="rule">depende de</text>
  <line x1="300" y1="450" x2="300" y2="472" class="edge" marker-end="url(#arr)"/>
  <text x="308" y="467" class="rule">depende de</text>
  <line x1="1000" y1="595" x2="1000" y2="573" class="edge" marker-end="url(#arr)"/>
  <text x="900" y="588" class="rule">implementa puertos</text>
</svg>
