<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .layer { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
      .rule { font-size: 11px; fill: #64748b; font-style: italic; }
      .name { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .desc { font-size: 11px; fill: #334155; }
      .tag { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .lbl { font-size: 11px; fill: #334155; }
      .band { fill: #f8fafc; stroke: #cbd5e1; }
      .core { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .gen { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .go { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .py { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .cpp { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.5; }
      .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .tHoy { fill: #64748b; }
      .tM0 { fill: #b45309; }
      .tM1 { fill: #16a34a; }
      .tM2 { fill: #9333ea; }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#ffffff"/>
  <text x="30" y="38" class="title">VizcachaIDE — Arquitectura multilenguaje (Go · Python · C++)</text>
  <text x="30" y="60" class="sub">Planteamiento sobre la edición 2.0 (Go + Wails + Svelte) · núcleo neutral + un perfil por lenguaje · sólo herramientas libres · bilingüe EN/ES · Windows / macOS / Linux</text>

  <!-- Leyenda -->
  <g transform="translate(30,78)">
    <rect x="0" y="0" width="14" height="12" class="core"/><text x="19" y="10" class="lbl">Existe hoy, se reutiliza</text>
    <rect x="150" y="0" width="14" height="12" class="gen"/><text x="169" y="10" class="lbl">Se generaliza en M0 (núcleo multilenguaje)</text>
    <rect x="400" y="0" width="14" height="12" class="go"/><text x="419" y="10" class="lbl">Perfil Go (hoy)</text>
    <rect x="505" y="0" width="14" height="12" class="py"/><text x="524" y="10" class="lbl">Perfil Python (M1)</text>
    <rect x="625" y="0" width="14" height="12" class="cpp"/><text x="644" y="10" class="lbl">Perfil C++ (M2)</text>
    <rect x="735" y="0" width="14" height="12" class="ext"/><text x="754" y="10" class="lbl">Herramienta externa libre</text>
    <text x="900" y="10" class="lbl">Etiqueta = fase en la que se escribe:</text>
    <rect x="1085" y="0" width="34" height="13" rx="3" class="tHoy"/><text x="1102" y="10" text-anchor="middle" class="tag">HOY</text>
    <rect x="1125" y="0" width="30" height="13" rx="3" class="tM0"/><text x="1140" y="10" text-anchor="middle" class="tag">M0</text>
    <rect x="1161" y="0" width="30" height="13" rx="3" class="tM1"/><text x="1176" y="10" text-anchor="middle" class="tag">M1</text>
    <rect x="1197" y="0" width="30" height="13" rx="3" class="tM2"/><text x="1212" y="10" text-anchor="middle" class="tag">M2</text>
  </g>

  <!-- ===== FRONTEND ===== -->
  <rect x="20" y="104" width="1240" height="118" rx="10" class="band"/>
  <text x="36" y="124" class="layer">FRONTEND · wails/frontend/src/lib</text>
  <text x="330" y="124" class="rule">Svelte 5 + CodeMirror 6 · nadie llama a wailsjs fuera de bridge/ · sin lógica de negocio en .svelte · los paneles consumen structs del dominio</text>

  <rect x="40" y="138" width="290" height="74" rx="8" class="core"/>
  <g transform="translate(286,144)"><rect width="36" height="14" rx="3" class="tHoy"/><text x="18" y="10.5" text-anchor="middle" class="tag">HOY</text></g>
  <text x="54" y="160" class="name">shell/ y panels/</text>
  <text x="54" y="178" class="desc">Output, Problems, Assistant, Variables, Calls,</text>
  <text x="54" y="192" class="desc">Threads (antes Goroutines), Files, Outline</text>

  <rect x="350" y="138" width="320" height="74" rx="8" class="gen"/>
  <g transform="translate(628,144)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="364" y="160" class="name">editor/: compartimento de lenguaje</text>
  <text x="364" y="178" class="desc">lang-go | lang-python | lang-cpp según la extensión</text>
  <text x="364" y="192" class="desc">sangría por perfil · completion, hover, definición (LSP)</text>

  <rect x="690" y="138" width="270" height="74" rx="8" class="gen"/>
  <g transform="translate(918,144)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="704" y="160" class="name">stores/language.ts</text>
  <text x="704" y="178" class="desc">perfil del archivo activo → capacidades:</text>
  <text x="704" y="192" class="desc">consola, paquetes, build, formato, hilos</text>

  <rect x="980" y="138" width="260" height="74" rx="8" class="gen"/>
  <g transform="translate(1198,144)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="994" y="160" class="name">bridge/ tipado + mock</text>
  <text x="994" y="178" class="desc">languages.profiles() · escenarios demo</text>
  <text x="994" y="192" class="desc">por lenguaje, sin herramientas instaladas</text>

  <line x1="640" y1="222" x2="640" y2="241" class="edge" marker-end="url(#arr)"/>

  <!-- ===== BRIDGE ===== -->
  <rect x="20" y="242" width="1240" height="88" rx="10" class="band"/>
  <text x="36" y="262" class="layer">BRIDGE · internal/bridge</text>
  <text x="250" y="262" class="rule">único paquete que importa el runtime de Wails · servicios finos · cada uno resuelve el LanguageSupport por la extensión del archivo activo · una sola ejecución o depuración a la vez</text>

  <rect x="40" y="276" width="130" height="44" rx="8" class="core"/>
  <text x="52" y="294" class="name">RunService</text>
  <text x="52" y="310" class="desc">run · build · check</text>

  <rect x="185" y="276" width="130" height="44" rx="8" class="core"/>
  <text x="197" y="294" class="name">DebugService</text>
  <text x="197" y="310" class="desc">pasos · variables</text>

  <rect x="330" y="276" width="140" height="44" rx="8" class="core"/>
  <text x="342" y="294" class="name">LanguageService</text>
  <text x="342" y="310" class="desc">un LSP por lenguaje</text>

  <rect x="485" y="276" width="140" height="44" rx="8" class="core"/>
  <text x="497" y="294" class="name">AssistantService</text>
  <text x="497" y="310" class="desc">explain EN/ES</text>

  <rect x="640" y="276" width="130" height="44" rx="8" class="gen"/>
  <g transform="translate(732,280)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="652" y="294" class="name">Packages</text>
  <text x="652" y="310" class="desc">go mod · pip · nada</text>

  <rect x="785" y="276" width="140" height="44" rx="8" class="gen"/>
  <g transform="translate(887,280)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="797" y="294" class="name">Languages</text>
  <text x="797" y="310" class="desc">Profiles() para la UI</text>

  <rect x="940" y="276" width="140" height="44" rx="8" class="gen"/>
  <g transform="translate(1042,280)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="952" y="294" class="name">Settings</text>
  <text x="952" y="310" class="desc">ToolPaths por rol</text>

  <rect x="1095" y="276" width="145" height="44" rx="8" class="core"/>
  <text x="1107" y="294" class="name">Console · Files</text>
  <text x="1107" y="310" class="desc">eval · diálogos por ext.</text>

  <line x1="640" y1="330" x2="640" y2="349" class="edge" marker-end="url(#arr)"/>

  <!-- ===== APP ===== -->
  <rect x="20" y="350" width="1240" height="104" rx="10" class="band"/>
  <text x="36" y="370" class="layer">APP · internal/app</text>
  <text x="200" y="370" class="rule">puertos (interfaces) y casos de uso · importa sólo domain · no conoce Wails, procesos ni protocolos</text>

  <rect x="40" y="384" width="470" height="60" rx="8" class="gen"/>
  <g transform="translate(468,390)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="54" y="406" class="name">Puertos neutrales (ports.go, contrato v3)</text>
  <text x="54" y="422" class="desc">ProgramRunner · Debugger · LanguageServer · ErrorExplainer · EventSink · SettingsStore</text>
  <text x="54" y="436" class="desc">Console y PackageManager opcionales (nil = capacidad apagada en la UI)</text>

  <rect x="530" y="384" width="330" height="60" rx="8" class="gen"/>
  <g transform="translate(818,390)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="544" y="406" class="name">LanguageRegistry + LanguageSupport</text>
  <text x="544" y="422" class="desc">perfil + puertos de un lenguaje · ForPath(archivo) · Profiles()</text>
  <text x="544" y="436" class="desc">main.go construye tres LanguageSupport (composition root)</text>

  <rect x="880" y="384" width="360" height="60" rx="8" class="core"/>
  <g transform="translate(1196,390)"><rect width="36" height="14" rx="3" class="tHoy"/><text x="18" y="10.5" text-anchor="middle" class="tag">HOY</text></g>
  <text x="894" y="406" class="name">Casos de uso (sin cambios)</text>
  <text x="894" y="422" class="desc">ExplainError (dedup, sin hints) · BreakpointBook · ChangeTracker</text>
  <text x="894" y="436" class="desc">SplitProgramArguments · ResolveLanguage (idioma EN/ES)</text>

  <line x1="640" y1="454" x2="640" y2="473" class="edge" marker-end="url(#arr)"/>

  <!-- ===== DOMAIN ===== -->
  <rect x="20" y="474" width="1240" height="100" rx="10" class="band"/>
  <text x="36" y="494" class="layer">DOMAIN · internal/domain</text>
  <text x="240" y="494" class="rule">structs puros, sin imports del proyecto · espejo en frontend/src/lib/domain.ts · es el contrato congelado: cambiarlo exige un "Contract change request"</text>

  <rect x="40" y="508" width="380" height="58" rx="8" class="gen"/>
  <g transform="translate(378,514)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="54" y="530" class="name">LanguageProfile · Capabilities · ToolStatus</text>
  <text x="54" y="546" class="desc">id, extensiones, sangría, roles de herramienta,</text>
  <text x="54" y="560" class="desc">qué paneles y botones aplican a cada lenguaje</text>

  <rect x="440" y="508" width="400" height="58" rx="8" class="gen"/>
  <g transform="translate(798,514)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="454" y="530" class="name">RunConfiguration(+Language) · Thread · StopException</text>
  <text x="454" y="546" class="desc">antes GoModule, Goroutine y StopPanic · ProjectContext (go.mod,</text>
  <text x="454" y="560" class="desc">carpeta, pyproject) · Settings.ToolPaths y DefaultLanguage</text>

  <rect x="860" y="508" width="380" height="58" rx="8" class="core"/>
  <g transform="translate(1196,514)"><rect width="36" height="14" rx="3" class="tHoy"/><text x="18" y="10.5" text-anchor="middle" class="tag">HOY</text></g>
  <text x="874" y="530" class="name">Sin cambios</text>
  <text x="874" y="546" class="desc">Diagnostic · ErrorExplanation · CompletionItem · DocumentSymbol</text>
  <text x="874" y="560" class="desc">DebugState · Variable · StackFrame · ConsoleResult · FileNode</text>

  <!-- ===== PROTOCOLO COMPARTIDO ===== -->
  <rect x="20" y="594" width="1240" height="116" rx="10" class="band"/>
  <text x="36" y="614" class="layer">PROTOCOLO COMPARTIDO · internal/protocol</text>
  <text x="400" y="614" class="rule">paquete nuevo fuera de adapters/, extraído de delve/ y gopls/ · depende sólo de app y domain · los adapters lo importan, pero siguen sin importarse entre sí</text>

  <rect x="40" y="630" width="300" height="72" rx="8" class="gen"/>
  <g transform="translate(298,636)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="54" y="652" class="name">protocol/dap</text>
  <text x="54" y="668" class="desc">Client go-dap (hoy delve/client.go) · petición</text>
  <text x="54" y="682" class="desc">inversa runInTerminal · mapeo de pila, ámbitos,</text>
  <text x="54" y="696" class="desc">variables e hilos (hoy delve/mapping.go)</text>

  <rect x="360" y="630" width="300" height="72" rx="8" class="gen"/>
  <g transform="translate(618,636)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="374" y="652" class="name">protocol/lsp</text>
  <text x="374" y="668" class="desc">conexión stdio jsonrpc2 (hoy gopls/connection.go)</text>
  <text x="374" y="682" class="desc">documentos abiertos · posiciones UTF-16</text>
  <text x="374" y="696" class="desc">mapeo de diagnósticos, símbolos y completado</text>

  <rect x="680" y="630" width="280" height="72" rx="8" class="gen"/>
  <g transform="translate(918,636)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="694" y="652" class="name">errorcatalog (motor)</text>
  <text x="694" y="668" class="desc">regex + {placeholders} + EN/ES + ids estables</text>
  <text x="694" y="682" class="desc">parser y catálogo JSON por lenguaje</text>
  <text x="694" y="696" class="desc">el mismo panel Assistant para los tres</text>

  <rect x="980" y="630" width="260" height="72" rx="8" class="gen"/>
  <g transform="translate(1198,636)"><rect width="34" height="14" rx="3" class="tM0"/><text x="17" y="10.5" text-anchor="middle" class="tag">M0</text></g>
  <text x="994" y="652" class="name">pty (pseudoterminal)</text>
  <text x="994" y="668" class="desc">ConPTY (Windows) · creack/pty (Unix)</text>
  <text x="994" y="682" class="desc">salida sin búfer, stdin y colores</text>
  <text x="994" y="696" class="desc">como en una terminal real</text>

  <line x1="640" y1="729" x2="640" y2="711" class="edge" marker-end="url(#arr)"/>

  <!-- ===== ADAPTERS POR LENGUAJE ===== -->
  <rect x="20" y="730" width="1240" height="206" rx="10" class="band"/>
  <text x="36" y="750" class="layer">ADAPTERS · internal/adapters/&lt;lenguaje&gt;</text>
  <text x="370" y="750" class="rule">cada carpeta implementa los puertos de un LanguageSupport apoyándose en protocol/ · nunca importa bridge ni otro adapter · se registra sólo en main.go</text>

  <rect x="40" y="766" width="393" height="160" rx="8" class="go"/>
  <g transform="translate(389,772)"><rect width="36" height="14" rx="3" class="tHoy"/><text x="18" y="10.5" text-anchor="middle" class="tag">HOY</text></g>
  <text x="54" y="788" class="name">golang/</text>
  <text x="54" y="806" class="desc">Reagrupa toolchain, delve, gopls, console y errorcatalog de hoy</text>
  <text x="54" y="821" class="desc">Ejecutor: go run · go build · go vet · gofmt · go mod</text>
  <text x="54" y="836" class="desc">Depurador: Delve, lanzamiento y mapeo propio (frames runtime)</text>
  <text x="54" y="851" class="desc">LSP: gopls, initialize y localizador (GOBIN, GOPATH/bin)</text>
  <text x="54" y="866" class="desc">Consola: yaegi, sesión persistente</text>
  <text x="54" y="881" class="desc">Errores: parser de salida go + catalog.go.json (25 entradas)</text>
  <text x="54" y="896" class="desc">Paquetes: go mod init · get · tidy</text>
  <text x="54" y="914" class="desc" font-style="italic">Sólo cambian imports y nombres; el comportamiento 2.0 se conserva</text>

  <rect x="443" y="766" width="393" height="160" rx="8" class="py"/>
  <g transform="translate(794,772)"><rect width="34" height="14" rx="3" class="tM1"/><text x="17" y="10.5" text-anchor="middle" class="tag">M1</text></g>
  <text x="457" y="788" class="name">python/</text>
  <text x="457" y="806" class="desc">Ejecutor: python -u archivo.py · carpeta = proyecto · detecta .venv</text>
  <text x="457" y="821" class="desc">Sin build: el botón Build se oculta por capacidad</text>
  <text x="457" y="836" class="desc">Depurador: debugpy (DAP) por runInTerminal o attach</text>
  <text x="457" y="851" class="desc">LSP: python-lsp-server (jedi + pyflakes), python -m pylsp</text>
  <text x="457" y="866" class="desc">Formato y check: ruff format · ruff check</text>
  <text x="457" y="881" class="desc">Consola: REPL con el módulo code (stdlib), JSON por stdio</text>
  <text x="457" y="896" class="desc">Errores: parser de tracebacks + catalog.python.json</text>
  <text x="457" y="914" class="desc">Paquetes: pip install · uninstall · list</text>

  <rect x="846" y="766" width="394" height="160" rx="8" class="cpp"/>
  <g transform="translate(1198,772)"><rect width="34" height="14" rx="3" class="tM2"/><text x="17" y="10.5" text-anchor="middle" class="tag">M2</text></g>
  <text x="860" y="788" class="name">cpp/</text>
  <text x="860" y="806" class="desc">Compilador: g++ o clang++ · -g -O0 -std=c++17 -Wall -Wextra</text>
  <text x="860" y="821" class="desc">Dos etapas: compilar → ejecutar · varios .cpp en la carpeta = proyecto</text>
  <text x="860" y="836" class="desc">Depurador: lldb-dap o gdb -i=dap (GDB ≥ 14), vía runInTerminal</text>
  <text x="860" y="851" class="desc">LSP: clangd (compile_flags.txt opcional) · Formato: clang-format</text>
  <text x="860" y="866" class="desc">Consola: ninguna (capacidad apagada, panel oculto)</text>
  <text x="860" y="881" class="desc">Errores: diagnósticos GNU, enlazador, caídas (SIGSEGV, código 139)</text>
  <text x="860" y="896" class="desc">Catálogo: catalog.cpp.json con patrones de GCC y de Clang</text>
  <text x="860" y="914" class="desc">Paquetes: ninguno en la primera versión</text>

  <line x1="640" y1="936" x2="640" y2="955" class="edge" marker-end="url(#arr)"/>

  <!-- ===== HERRAMIENTAS EXTERNAS ===== -->
  <rect x="20" y="956" width="1240" height="104" rx="10" class="band"/>
  <text x="36" y="976" class="layer">HERRAMIENTAS EXTERNAS (todas libres) · toolchain/&lt;lenguaje&gt;/ junto al ejecutable</text>
  <text x="640" y="976" class="rule">versiones y sha256 fijados como hoy · variantes de instalación: lite · full-go · full-python · full-cpp · full (las tres)</text>

  <rect x="40" y="990" width="393" height="60" rx="8" class="ext"/>
  <text x="54" y="1010" class="name">Go 1.25 · Delve · gopls</text>
  <text x="54" y="1026" class="desc">BSD-3 · MIT · BSD-3 · ya empaquetado hoy (variante full ≈ 90 MB)</text>
  <text x="54" y="1040" class="desc">localizador: configurado → empaquetado → PATH (se conserva)</text>

  <rect x="443" y="990" width="393" height="60" rx="8" class="ext"/>
  <text x="457" y="1010" class="name">CPython + debugpy, python-lsp-server, ruff</text>
  <text x="457" y="1026" class="desc">python-build-standalone (PSF) · wheels MIT con versión fijada</text>
  <text x="457" y="1040" class="desc">pip instala en el intérprete empaquetado (instalación por usuario)</text>

  <rect x="846" y="990" width="394" height="60" rx="8" class="ext"/>
  <text x="860" y="1010" class="name">LLVM: clang++, lldb-dap, clangd, clang-format</text>
  <text x="860" y="1026" class="desc">Apache-2.0 · alternativa GCC + GDB ≥ 14 (GPLv3, programas aparte)</text>
  <text x="860" y="1040" class="desc">Windows: llvm-mingw o WinLibs · macOS/Linux: LLVM o el del sistema</text>
</svg>
