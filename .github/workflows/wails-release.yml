name: wails-release

# Push a tag like wails-v2.0.0-rc1 to build the lite, full-go, full-python and full (Go + Python, plus C++ on Windows)
# packages of the Wails variant on Windows, macOS (arm64 + x86_64) and Linux, plus full-cpp (llvm-mingw) on Windows only,
# and create a DRAFT GitHub Release (EN/ES notes). macOS and Linux have no bundled C++ compiler: they use the system one.
# workflow_dispatch builds the same artifacts without creating a release (dry run).
# The PyQt 1.x line keeps its own workflow (release.yml, tags v*).
on:
  push:
    tags: ["wails-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wails-release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.16.0

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            target: windows/amd64
          - os: macos-14            # Apple Silicon
            label: macos-arm64
            target: darwin/arm64
          - os: macos-15-intel      # Intel
            label: macos-amd64
            target: darwin/amd64
          - os: ubuntu-22.04        # glibc 2.35 / WebKitGTK 4.1 baseline
            label: linux-amd64
            target: linux/amd64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # packaging/versions.py needs tomllib (3.11+)

      # Host Go: builds the app and cross-builds dlv/gopls. packaging/go_tools.py sets GOTOOLCHAIN
      # to the Go version pinned in packaging/versions.toml for the bundled tools.
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wails/frontend/package-lock.json

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb libfuse2 file

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Frontend dependencies
        run: npm ci
        working-directory: wails/frontend

      - name: Check the tag against wails.json
        if: startsWith(github.ref, 'refs/tags/wails-v')
        run: |
          version=$(python -c "import json; print(json.load(open('wails/wails.json'))['info']['productVersion'])")
          if [ "wails-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} differs from wails.json productVersion (${version})"
            exit 1
          fi

      - name: Cache Go toolchain downloads and built tools
        uses: actions/cache@v4
        with:
          path: |
            packaging/cache/downloads
            packaging/cache/tools
            packaging/cache/wheels
          key: wails-toolchain-${{ matrix.label }}-${{ hashFiles('packaging/versions.toml') }}

      - name: Build lite, full-go, full-python, full-cpp (Windows) and full
        run: python wails/packaging/build_release.py --variant all --target ${{ matrix.target }}

      - name: Smoke test (the app stays alive, bundled go, python and C++ work)
        run: |
          cd wails/dist
          python_smoke="python ../packaging/smoke_test.py"
          variants="lite full-go full-python full"
          if [ "${{ runner.os }}" = "Windows" ]; then variants="lite full-go full-python full-cpp full"; fi
          for variant in $variants; do
            work=$(mktemp -d)
            case "${{ runner.os }}" in
              Windows)
                python -m zipfile -e "$(ls release/VizcachaIDE-*-windows-amd64-${variant}-portable.zip)" "$work"
                root="$work/VizcachaIDE"; exe="$root/VizcachaIDE.exe"
                go="$root/toolchain/go/bin/go.exe"; py="$root/toolchain/python/python.exe"
                cxx="$root/toolchain/cpp/bin/clang++.exe" ;;
              macOS)
                app=$(ls -d work/VizcachaIDE-*-macos-*-${variant}/VizcachaIDE.app)
                exe="$app/Contents/MacOS/vizcacha"
                go="$app/Contents/MacOS/toolchain/go/bin/go"; py="$app/Contents/MacOS/toolchain/python/bin/python3" ;;
              Linux)
                tar -xzf release/VizcachaIDE-*-linux-amd64-${variant}.tar.gz -C "$work"
                root="$work/VizcachaIDE"; exe="$root/VizcachaIDE"
                go="$root/toolchain/go/bin/go"; py="$root/toolchain/python/bin/python3"
                python_smoke="xvfb-run -a python ../packaging/smoke_test.py" ;;
            esac
            extra=""
            case "$variant" in
              full-go|full) extra="$extra --go $go" ;;
            esac
            case "$variant" in
              full-python|full) extra="$extra --python $py" ;;
            esac
            case "$variant" in
              full-cpp|full) [ "${{ runner.os }}" = "Windows" ] && extra="$extra --cxx $cxx" ;;
            esac
            $python_smoke "$exe" --seconds 8 $extra
          done

      - name: List artifacts
        run: ls -la wails/dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: vizcacha-wails-${{ matrix.label }}
          path: |
            wails/dist/release/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/wails-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: vizcacha-wails-*
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          # The SHA256SUMS-<os>-<arch>.txt of each build stay: the IDE's updater verifies its
          # download with the one of its platform. SHA256SUMS.txt covers everything for people.
          sha256sum $(ls | grep -v '^SHA256SUMS') > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes (EN/ES)
        run: |
          cat > release-notes.md <<EOF
          ## VizcachaIDE (Wails) ${GITHUB_REF_NAME#wails-}

          ### English
          New VizcachaIDE built with Go + Wails (a lighter app, no Python, MIT-licensed).

          | Download | Contents |
          |---|---|
          | \`*-full-*\` | IDE + Go, Delve, gopls and Python (debugpy, python-lsp-server, ruff); on Windows also C++ (clang, lldb-dap, clangd, clang-format): nothing else to install |
          | \`*-full-go-*\` | IDE + Go, Delve and gopls |
          | \`*-full-python-*\` | IDE + Python 3.12 with debugger, completion and formatter |
          | \`*-windows-amd64-full-cpp-*\` | Windows only: IDE + C++ (llvm-mingw: clang, lldb-dap, clangd, clang-format) with CMake, Ninja and vcpkg for libraries. On macOS and Linux C++ uses the compiler of the system |
          | \`*-lite-*\` | IDE only; uses the Go / Python installed on your system |
          | \`*-windows-amd64-*-setup.exe\` | Windows installer (per user, no administrator) |
          | \`*-portable.zip\` | Windows, no installation needed |
          | \`*-macos-arm64-*.dmg\` / \`*-macos-amd64-*.dmg\` | macOS, Apple Silicon / Intel |
          | \`*.AppImage\` / \`*.tar.gz\` | Linux x86_64 (needs WebKitGTK 4.1: \`libwebkit2gtk-4.1-0\`) |

          Rust is not bundled: VizcachaIDE uses the Rust installed with rustup (it tells you how). What changed: \`CHANGELOG.md\`.

          macOS and Windows builds are not code-signed yet: on macOS right-click the app and choose
          **Open** the first time; on Windows choose **More info > Run anyway** in SmartScreen.

          ### Español
          Nuevo VizcachaIDE hecho con Go + Wails (app más ligera, sin Python, licencia MIT).

          | Descarga | Contenido |
          |---|---|
          | \`*-full-*\` | IDE + Go, Delve, gopls y Python (debugpy, python-lsp-server, ruff); en Windows también C++ (clang, lldb-dap, clangd, clang-format): no hace falta instalar nada más |
          | \`*-full-go-*\` | IDE + Go, Delve y gopls |
          | \`*-full-python-*\` | IDE + Python 3.12 con depurador, autocompletado y formateador |
          | \`*-windows-amd64-full-cpp-*\` | Sólo Windows: IDE + C++ (llvm-mingw: clang, lldb-dap, clangd, clang-format) con CMake, Ninja y vcpkg para librerías. En macOS y Linux C++ usa el compilador del sistema |
          | \`*-lite-*\` | Sólo el IDE; usa el Go o el Python instalado en tu sistema |
          | \`*-windows-amd64-*-setup.exe\` | Instalador de Windows (por usuario, sin administrador) |
          | \`*-portable.zip\` | Windows, sin instalación |
          | \`*-macos-arm64-*.dmg\` / \`*-macos-amd64-*.dmg\` | macOS, Apple Silicon / Intel |
          | \`*.AppImage\` / \`*.tar.gz\` | Linux x86_64 (requiere WebKitGTK 4.1: \`libwebkit2gtk-4.1-0\`) |

          Rust no viene incluido: VizcachaIDE usa el Rust instalado con rustup (te indica cómo). Qué cambió: \`CHANGELOG.md\`.

          Las versiones de macOS y Windows aún no están firmadas: en macOS, clic derecho sobre la
          app y **Abrir** la primera vez; en Windows, **Más información > Ejecutar de todos modos**.

          Checksums / sumas de verificación: \`SHA256SUMS.txt\`. Licencias: \`NOTICE.md\`.
          EOF
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release-assets/* wails/packaging/NOTICE.md \
            --draft ${prerelease} --verify-tag \
            --title "VizcachaIDE (Wails) ${GITHUB_REF_NAME#wails-}" \
            --notes-file release-notes.md
