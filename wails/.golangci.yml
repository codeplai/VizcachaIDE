version: "2"

run:
  timeout: 5m
  build-tags:
    - webkit2_41

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - funlen
    - govet
    - ineffassign
    - nestif
    - staticcheck
    - unused
  settings:
    funlen:
      lines: 50
      statements: 40
    nestif:
      min-complexity: 5
    depguard:
      rules:
        # PLAN_WAILS.md section 2.1: dependency rules, checked in CI.
        domain-is-pure:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal
              desc: domain must not import anything else of the project
            - pkg: github.com/wailsapp
              desc: domain must not know about Wails
        app-only-domain:
          list-mode: strict
          files:
            - "**/internal/app/**"
          allow:
            - $gostd
            - github.com/codeplai/VizcachaIDE/wails/internal/domain
          deny:
            - pkg: github.com/wailsapp
              desc: app (use cases and ports) must not know about Wails
        bridge-is-thin:
          list-mode: strict
          files:
            - "**/internal/bridge/**"
          allow:
            - $gostd
            - github.com/codeplai/VizcachaIDE/wails/internal/domain
            - github.com/codeplai/VizcachaIDE/wails/internal/app
            - github.com/wailsapp/wails/v2/pkg/runtime
        only-bridge-uses-the-wails-runtime:
          files:
            - $all
            - "!**/internal/bridge/**"
          deny:
            - pkg: github.com/wailsapp/wails/v2/pkg/runtime
              desc: only internal/bridge may import the Wails runtime
        adapters-are-independent:
          # Neutral adapters (settings, filewatch, filesystem, windowstate) and any new one: an
          # adapter talks only to domain/app ports and internal/protocol. Language adapters have
          # their own rule below (PLAN_NUCLEO_MULTILENGUAJE.md section 4.6).
          files:
            - "**/internal/adapters/**"
            - "!**/internal/adapters/golang/**"
            - "!**/internal/adapters/python/**"
            - "!**/internal/adapters/cpp/**"
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/bridge
              desc: adapters never import bridge
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters
              desc: adapters never import other adapters
        go-adapter-stays-in-go:
          # Inside one language folder imports are fine; between languages and towards the
          # neutral adapters they are not. depguard lets a deny win over a longer allow, so every
          # sibling folder is denied by name (keep this list in sync when an adapter folder is
          # added). M1 and M2 copy this rule for python/ and cpp/.
          files:
            - "**/internal/adapters/golang/**"
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/bridge
              desc: adapters never import bridge
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/python
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/cpp
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/settings
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filewatch
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filesystem
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/windowstate
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/updates
              desc: a language adapter imports only its own folder
        python-adapter-stays-in-python:
          # Same rule as go-adapter-stays-in-go, for the Python adapter (PLAN_PYTHON.md section 3.1).
          files:
            - "**/internal/adapters/python/**"
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/bridge
              desc: adapters never import bridge
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/golang
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/cpp
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/settings
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filewatch
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filesystem
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/windowstate
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/updates
              desc: a language adapter imports only its own folder
        cpp-adapter-stays-in-cpp:
          # Same rule as go-adapter-stays-in-go, for the C++ adapter (PLAN_CPP.md section 3.1).
          files:
            - "**/internal/adapters/cpp/**"
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/bridge
              desc: adapters never import bridge
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/golang
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/python
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/settings
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filewatch
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/filesystem
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/windowstate
              desc: a language adapter imports only its own folder
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters/updates
              desc: a language adapter imports only its own folder
        protocol-is-shared:
          # Code shared by the language adapters: DAP, LSP, processes, PTY, error catalog.
          list-mode: strict
          files:
            - "**/internal/protocol/**"
          allow:
            - $gostd
            - github.com/codeplai/VizcachaIDE/wails/internal/domain
            - github.com/codeplai/VizcachaIDE/wails/internal/app
            - github.com/codeplai/VizcachaIDE/wails/internal/protocol
            - github.com/google/go-dap
            - go.lsp.dev
            - github.com/aymanbagabas/go-pty
            - github.com/charmbracelet/x/ansi
          deny:
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/adapters
              desc: protocol never imports adapters
            - pkg: github.com/codeplai/VizcachaIDE/wails/internal/bridge
              desc: protocol never imports bridge
  exclusions:
    paths:
      - frontend
    rules:
      - path: _test\.go
        linters:
          - funlen
