name: Release

# Push a tag like v0.3.0 to build every installer and create a DRAFT GitHub Release.
# workflow_dispatch builds the same artifacts without creating a release (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            exe: VizcachaIDE/VizcachaIDE.exe
            go: VizcachaIDE/toolchain/go/bin/go.exe
          - os: macos-14            # Apple Silicon (arm64)
            label: macos-arm64
            exe: VizcachaIDE.app/Contents/MacOS/VizcachaIDE
            go: VizcachaIDE.app/Contents/MacOS/toolchain/go/bin/go
          - os: macos-15-intel      # Intel (x86_64); macos-13 is being retired by GitHub
            label: macos-x86_64
            exe: VizcachaIDE.app/Contents/MacOS/VizcachaIDE
            go: VizcachaIDE.app/Contents/MacOS/toolchain/go/bin/go
          - os: ubuntu-22.04        # glibc 2.35 baseline for the AppImage
            label: linux-x86_64
            exe: VizcachaIDE/VizcachaIDE
            go: VizcachaIDE/toolchain/go/bin/go
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      # Host Go: only used to cross-build dlv and gopls. GOTOOLCHAIN in packaging/go_tools.py
      # switches to the exact Go version pinned in packaging/versions.toml.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache Go downloads and built tools
        uses: actions/cache@v4
        with:
          path: |
            packaging/cache/downloads
            packaging/cache/tools
          key: toolchain-${{ matrix.label }}-${{ hashFiles('packaging/versions.toml') }}

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 file

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Check tag against __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'packaging'); from versions import app_version; print(app_version())")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} differs from vizcacha.__version__ (${version})"
          fi

      - name: Build lite
        run: python packaging/build.py --variant lite --package

      - name: Smoke test lite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke_test.py "dist/lite/${{ matrix.exe }}" --seconds 6

      - name: Build full (bundled Go, dlv, gopls)
        run: python packaging/build.py --variant full --package

      - name: Check bundled toolchain
        run: |
          "dist/full/${{ matrix.go }}" version
          ls -la "$(dirname "dist/full/${{ matrix.go }}")/../../bin"

      - name: Smoke test full
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke_test.py "dist/full/${{ matrix.exe }}" --seconds 6

      - name: List artifacts
        run: ls -la dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: VizcachaIDE-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: VizcachaIDE-*
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes (EN/ES)
        run: |
          cat > release-notes.md <<EOF
          ## VizcachaIDE ${GITHUB_REF_NAME}

          ### English
          Beginner-friendly IDE for Go.

          | Download | Contents |
          |---|---|
          | \`*-full-setup.exe\`, \`*-full.dmg\`, \`*-full.AppImage\` | IDE + Go, Delve and gopls (nothing else to install) |
          | \`*-lite-*\` | IDE only, uses the Go installed on your system |
          | \`*-portable.zip\` | Windows, no installation needed |

          macOS builds: \`macos-arm64\` (Apple Silicon) and \`macos-x86_64\` (Intel). The app is not
          notarized yet: right-click the app and choose **Open** the first time.

          **License:** the VizcachaIDE source code is MIT, but these binaries bundle PyQt5 (GPLv3),
          so the distributed program is licensed under the **GPLv3**. See \`NOTICE.md\`.

          ### Español
          IDE de Go para principiantes.

          | Descarga | Contenido |
          |---|---|
          | \`*-full-setup.exe\`, \`*-full.dmg\`, \`*-full.AppImage\` | IDE + Go, Delve y gopls (no hace falta instalar nada más) |
          | \`*-lite-*\` | Sólo el IDE; usa el Go instalado en el sistema |
          | \`*-portable.zip\` | Windows, sin instalación |

          macOS: \`macos-arm64\` (Apple Silicon) y \`macos-x86_64\` (Intel). La app aún no está
          notarizada: la primera vez, haz clic derecho sobre ella y elige **Abrir**.

          **Licencia:** el código de VizcachaIDE es MIT, pero estos binarios incluyen PyQt5 (GPLv3),
          así que el programa distribuido queda bajo la **GPLv3**. Consulta \`NOTICE.md\`.

          Checksums / sumas de verificación: \`SHA256SUMS.txt\`.
          EOF
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release-assets/* packaging/NOTICE.md \
            --draft ${prerelease} --verify-tag \
            --title "VizcachaIDE ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
